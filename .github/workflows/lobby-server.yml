# Builds the lobby server on Linux, the way Tools/LobbyServer/setup-linux.sh builds it on the server,
# so a change that would break it there is caught here first. Both kinds of processor: Oracle Cloud's
# free machines are ARM, and most others are x86.
#
# Free for a public repository. Only runs when something the server is built from changes.
name: Lobby server (Linux)

on:
  push:
    paths:
      - "Engine/Net/Lobby*"
      - "Engine/Net/SocketSystem.*"
      - "Tools/LobbyServer/**"
      - ".github/workflows/lobby-server.yml"
  pull_request:
    paths:
      - "Engine/Net/Lobby*"
      - "Engine/Net/SocketSystem.*"
      - "Tools/LobbyServer/**"
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Engine/Net
            Tools/LobbyServer

      - name: Build
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -I. \
              Tools/LobbyServer/main.cpp \
              Engine/Net/LobbyServer.cpp Engine/Net/LobbyDirectory.cpp Engine/Net/LobbyProtocol.cpp \
              Engine/Net/SocketSystem.cpp \
              -o predation-lobby-server

      - name: Starts and answers
        run: |
          ./predation-lobby-server --port 27020 &
          PID=$!
          sleep 1
          # A List request (magic 'PLBY' little-endian, kind 5, version 0); any answer at all is a pass.
          printf 'YLBP\x05\x00\x00' > list.bin
          timeout 3 bash -c 'exec 3<>/dev/udp/127.0.0.1/27020; cat list.bin >&3; head -c 6 <&3 | od -An -tx1' | tee answer.txt
          kill $PID
          test -s answer.txt

      - uses: actions/upload-artifact@v4
        with:
          name: predation-lobby-server-${{ matrix.runner }}
          path: predation-lobby-server
